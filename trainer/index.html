<script>
(()=>{if(!ZA)return;
// BACKEND: login and sessions below are SIMULATED in the browser (demo accounts). Production: POST /api/auth/login/ on api.<domain> (Django), httpOnly secure cookie/JWT, role checked on the server for every request.
const A=$('#app'),ss=sessionStorage,ls=localStorage,go=h=>{location.hash=h};
const RL={student:{n:'Student',t:'Student Portal',i:'graduation-cap',d:'Sign in to view your timetable, attendance, fees and announcements.',ph:'Student ID, email or mobile number',ids:['ZK1001','student@zeakus.demo','9847010000'],pw:'student123',ar:'student'},
trainer:{n:'Trainer',t:'Trainer Portal',i:'chalkboard-user',d:'Sign in to manage your batches, attendance and class schedule.',ph:'Trainer ID, email or mobile number',ids:['T-001','trainer@zeakus.demo','9847000001'],pw:'trainer123',ar:'trainer'},
manager:{n:'Manager',t:'Manager Portal',i:'building',d:'Sign in to manage students, trainers, courses, fees and operations.',ph:'Manager username or email',ids:['manager','manager@zeakus.demo'],pw:'manager123',ar:'admin'}};
const HOSTROLE={student:'student',trainer:'trainer',manager:'manager',admin:'manager'};
const KEY=window.ZEAKUS_ROLE||HOSTROLE[location.hostname.split('.')[0]]||new URLSearchParams(location.search).get('role')||'student';
const ROLE=RL[KEY]?KEY:'student',R0=RL[ROLE];
const DEMO=!/^(student|trainer|manager|admin)\./.test(location.hostname);
const TTL=8*36e5;
const sess=()=>{for(const st of[ss,ls]){try{const v=JSON.parse(st.zkp_s||'null');if(v&&v.role===ROLE&&v.exp>Date.now())return v}catch(e){}}return null};
const setSess=rm=>{const v=JSON.stringify({role:ROLE,exp:Date.now()+(rm?30*864e5:TTL)});try{(rm?ls:ss).zkp_s=v}catch(e){}};
const clearSess=()=>{try{ss.removeItem('zkp_s');ls.removeItem('zkp_s')}catch(e){}};
const shell=b=>`<div class="zp"><header class="zph"><span class="logo"><img src="${LG_L}" alt="Zeakus Institution"></span><span class="tg2">${R0.t}</span></header>${b}<div class="zpf">© 2026 ZEAKUS INSTITUTION${DEMO?' · Demo environment – sample accounts only':''}</div></div>`;
function login(){if(sess())return go('#/app');
A.innerHTML=`<div class="pl"><div class="plc"><img class="plg" src="${LG_L}" alt="Zeakus Institution"><span class="tg2">${R0.t}</span><h1>Welcome back</h1><p class="pd">${R0.d}</p>
<form id="zl" novalidate><label for="zu">Username</label><input id="zu" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${R0.ph}"><label for="zpw">Password</label><div class="pw"><input id="zpw" name="password" type="password" autocomplete="current-password" placeholder="Password"><button type="button" id="zsh" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><label class="zr"><input type="checkbox" name="rm" style="width:auto"> Keep me signed in on this device</label><p class="pe" id="zerr" role="alert" hidden></p><button class="btn" id="zgo">Sign in</button><a href="#" id="zfp">Forgot password? Contact the institution office.</a></form>
${DEMO?`<div class="zdemo"><b>Demo account</b><br><small>${R0.ids[0]} / ${R0.pw}</small><br><button type="button" class="btn sm ghost" id="zdm" style="margin-top:8px">Fill demo login</button></div>`:''}
<div class="pi"><button class="btn ghost" id="inst" type="button"><i class="fa-solid fa-download"></i> Install ${R0.n} app</button></div></div><p class="plf">© 2026 ZEAKUS INSTITUTION</p></div>`;
let fails=+ss.zkp_f||0;
$('#zsh').onclick=()=>{const p=$('#zpw'),on=p.type==='password';p.type=on?'text':'password';$('#zsh').innerHTML=`<i class="fa-regular fa-eye${on?'-slash':''}"></i>`;$('#zsh').setAttribute('aria-label',on?'Hide password':'Show password')};
$('#zfp').onclick=e=>{e.preventDefault();toast('Please contact the institution office to reset your password.')};
if(DEMO)$('#zdm').onclick=()=>{$('#zu').value=R0.ids[0];$('#zpw').value=R0.pw};
$('#zl').onsubmit=e=>{e.preventDefault();const f=e.target,u=f.username.value.trim().toLowerCase(),p=f.password.value,err=m=>{const x=$('#zerr');x.textContent=m;x.hidden=false};
if(Date.now()<(+ss.zkp_l||0))return err('Too many attempts. Please wait a few seconds and try again.');
if(!u||!p)return err('Please enter your username and password.');
if(R0.ids.some(x=>x.toLowerCase()==u)&&p===R0.pw){ss.zkp_f=0;setSess(f.rm.checked);go('#/app')}
else{fails++;ss.zkp_f=fails;if(fails>=5){ss.zkp_l=Date.now()+30000;ss.zkp_f=0;fails=0;return err('Too many attempts. Try again in 30 seconds.')}err('Incorrect username or password.')}};
}
function appPage(){if(!sess())return go('#/login');
const src=$('#zkapp').textContent.replace(/<\\\/script>/g,'<'+'/script>').replace('<head>','<head><script>window.PRE="'+R0.ar+'"<'+'/script>');
A.innerHTML=(ROLE==='manager'?'<div class="zbar"><a href="#/cms"><i class="fa-solid fa-pen-to-square"></i> Website CMS</a></div>':'')+'<button id="inst" hidden></button>';
const f=document.createElement('iframe');f.className='zpi'+(ROLE==='manager'?' wb':'');f.title='ZEAKUS '+R0.t;f.srcdoc=src;A.appendChild(f);
window.onmessage=(e=>{if(e.data=='zk-logout'){clearSess();go('#/login')}if(e.data=='zk-install')window.zkInstall&&zkInstall()})}
/* ---------- Website content management panel (manager only) ---------- */
const fld=(n,l,v,a)=>`<label>${l}</label>${a?`<textarea name="${n}" rows="3">${esc(v)}</textarea>`:`<input name="${n}" value="${esc(v)}">`}`;
const SEC=['Featured Courses','Why Choose Zeakus','Admission Process','Our Expert Trainers','What Our Students Say','Career Success Stories','Gallery','Latest Articles'];
const C={
home:['Homepage',()=>{const h=DB.get('home');return `<h2>Homepage content</h2><form data-f="home">${fld('title','Hero heading',h.title)}${fld('desc','Hero text',h.desc,1)}${fld('intro','Welcome introduction',h.intro,1)}<div class="g2"><div>${fld('cta1','Button 1 label',h.cta1)}</div><div>${fld('cta2','Button 2 label',h.cta2)}</div></div><div class="g2"><div>${fld('years','Years in placement field',h.years)}</div><div>${fld('placed','Students placed (demo figure)',h.placed)}</div></div><button class="btn">Save homepage</button></form>`}],
about:['About Us',()=>{const a=DB.get('about');return `<h2>About Us</h2><form data-f="about">${fld('intro','Introduction',a.intro,1)}${fld('vision','Vision',a.vision,1)}${fld('mission','Mission',a.mission,1)}${fld('approach','Our approach',a.approach,1)}${fld('why','Why choose us (one per line)',a.why.join('\n'),1)}${fld('ach','Achievements (one per line)',a.achievements.join('\n'),1)}<button class="btn">Save About Us</button></form>`}],
courses:['Courses',()=>`<div class="top" style="background:none;padding:0;display:flex;justify-content:space-between"><h2>Courses on the website</h2><button class="btn sm" data-cn>+ Add course</button></div><br><div class="tw"><table><tr><th>Course</th><th>Category</th><th>Mode</th><th>Website</th><th></th></tr>${DB.get('courses').map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.cat)}</td><td>${esc(c.mode)}</td><td><button class="btn sm ghost" data-cp="${c.id}">${c.pub?'Published':'Hidden'}</button></td><td><button class="btn sm ghost" data-ce="${c.id}">Edit</button> <button class="btn sm ghost" data-cd="${c.id}">Delete</button></td></tr>`).join('')}</table></div>`],
banners:['Banners & Images',()=>{const h=DB.get('home');return `<h2>Banners &amp; images</h2><form data-f="home">${fld('img','Homepage banner image URL',h.img)}<button class="btn">Save banner</button></form><h3>Gallery images</h3><br><div class="zg">${DB.get('gallery').map(g=>`<div class="card">${img(g.img)}<div style="padding:8px"><small>${esc(g.title)}</small><br><button class="btn sm ghost" data-gd="${g.id}">Remove</button></div></div>`).join('')}</div><form data-f="gal"><div class="g2"><div>${fld('title','Image title','')}</div><div>${fld('cat','Category','Classroom')}</div></div>${fld('img','Image URL','')}<button class="btn">Add image</button></form>`}],
contact:['Contact Details',()=>{const s=DB.get('settings');return `<h2>Contact details</h2><form data-f="contact">${fld('phone1','Phone 1',s.phone1)}${fld('phone2','Phone 2',s.phone2)}${fld('email','Email',s.email)}${fld('address','Address',s.address,1)}${fld('instagram','Instagram URL',s.instagram)}${fld('facebook','Facebook URL',s.facebook)}${fld('whatsapp','WhatsApp number (digits only)',s.whatsapp)}<button class="btn">Save contact details</button></form>`}],
enq:['Enquiries',()=>`<h2>Website enquiries</h2><br><div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Course</th><th>Date</th><th>Status</th><th>Notes</th><th></th></tr>${DB.get('enquiries').map(q=>`<tr><td>${esc(q.name)}</td><td>${esc(q.phone)}</td><td>${esc(q.course)}</td><td>${fmt(q.date)}</td><td><select data-enq="${q.id}" data-k="status">${['New','Contacted','Closed'].map(x=>`<option${x==q.status?' selected':''}>${x}</option>`).join('')}</select></td><td><input data-enq="${q.id}" data-k="notes" value="${esc(q.notes)}"></td><td><button class="btn sm ghost" data-ed="${q.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No enquiries yet</td></tr>'}</table></div>`],
vis:['Sections & Visibility',()=>{const hid=JSON.parse(ls.zk_hidden||'[]');return `<h2>Homepage section visibility</h2><p>Untick a section to hide it from the public homepage.</p><br>${SEC.map(s=>`<label class="zr"><input type="checkbox" data-v="${s}" ${hid.includes(s)?'':'checked'} style="width:auto"> ${s}</label>`).join('')}`}],
prev:['Preview',()=>`<h2>Website preview</h2><p>Live preview with your latest saved changes. <a class="btn sm" target="_blank" href="${WEB}#/index">Open in new tab</a></p><br>${WEB?`<iframe class="zpv" src="${WEB}#/index" title="Website preview"></iframe>`:`<p class="demo2">Set window.ZEAKUS_WEBSITE_URL to your public website address to enable the preview.</p>`}`]};
function cms(){if(ROLE!=='manager'||!sess())return go('#/login');const t=C[ss.zkp_tab]?ss.zkp_tab:'home';
A.innerHTML=shell(`<div class="zc"><aside class="zcs"><h3>Website CMS</h3><span class="tg2" style="align-self:flex-start;margin:6px 0 12px">Website Admin</span>${Object.entries(C).map(([k,v])=>`<a data-t="${k}" class="${k==t?'on':''}">${v[0]}</a>`).join('')}<a href="#/app">← Dashboard</a><a id="zco">Log out</a></aside><section class="zcm"><p class="demo2">Manages the public website only – separate from institution operations. Changes are saved in this browser (demo). BACKEND: Django REST API with a dedicated website-admin permission group.</p>${C[t][1]()}</section></div>`)}
function cform(id){const c=id?DB.get('courses').find(x=>x.id==id):{title:'',cat:'HR',duration:'',mode:'Classroom',img:'',short:'',overview:''};$('#zm')?.remove();
document.body.insertAdjacentHTML('beforeend',`<div class="ov" id="zm"><form class="vcf" data-f="course"><button type="button" class="x" data-x aria-label="Close">×</button><h3>${id?'Edit':'Add'} course</h3><input type="hidden" name="id" value="${id||''}"><input name="title" placeholder="Course title *" value="${esc(c.title)}"><div class="g2"><select name="cat">${DB.get('categories').map(x=>`<option${x.name==c.cat?' selected':''}>${esc(x.name)}</option>`).join('')}</select><select name="mode">${['Classroom','Online','Hybrid'].map(x=>`<option${x==c.mode?' selected':''}>${x}</option>`).join('')}</select></div><input name="duration" placeholder="Duration" value="${esc(c.duration)}"><input name="img" placeholder="Image URL" value="${esc(c.img)}"><textarea name="short" rows="2" placeholder="Short description">${esc(c.short)}</textarea><textarea name="overview" rows="3" placeholder="Overview">${esc(c.overview)}</textarea><button class="btn">Save course</button></form></div>`)}
document.addEventListener('click',e=>{if(e.target.closest('[data-x]'))return $('#zm')?.remove();const t=e.target.closest('[data-t],[data-ce],[data-cn],[data-cd],[data-cp],[data-gd],[data-ed],#zco');if(!t)return;
if(t.dataset.t){ss.zkp_tab=t.dataset.t;return cms()}if(t.id=='zco'){clearSess();return go('#/login')}if('cn' in t.dataset)return cform();if(t.dataset.ce)return cform(+t.dataset.ce);
const k=t.dataset.gd?'gallery':t.dataset.ed?'enquiries':'courses',id=+(t.dataset.cd||t.dataset.cp||t.dataset.gd||t.dataset.ed),a=DB.get(k);
if(t.dataset.cp){const c=a.find(x=>x.id==id);c.pub=!c.pub;DB.set(k,a);toast(c.pub?'Course published':'Course hidden from the website');return cms()}
if(!confirm('Delete this record?'))return;DB.set(k,a.filter(x=>x.id!=id));toast('Deleted');cms()});
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();const v=Object.fromEntries(new FormData(f)),sv=(key,fn)=>{const d=DB.get(key);fn(d);DB.set(key,d)},ln=x=>x.split('\n').map(y=>y.trim()).filter(Boolean);
if(k=='home')sv('home',d=>Object.assign(d,v));
else if(k=='about')sv('about',d=>Object.assign(d,{intro:v.intro,vision:v.vision,mission:v.mission,approach:v.approach,why:ln(v.why),achievements:ln(v.ach)}));
else if(k=='contact')sv('settings',d=>Object.assign(d,v));
else if(k=='gal'){if(!v.img.trim())return toast('Enter an image URL');sv('gallery',d=>d.push({id:DB.nextId(d),title:v.title||'Image',cat:v.cat||'Classroom',img:v.img.trim()}))}
else if(k=='course'){if(!v.title.trim())return toast('Course title is required');sv('courses',a=>{if(v.id)Object.assign(a.find(x=>x.id==v.id),v,{id:+v.id});else a.push({...v,id:DB.nextId(a),objectives:['To be confirmed'],who:'To be confirmed',syllabus:['Module 1|Details to be confirmed'],outcomes:['To be confirmed'],internship:'To be confirmed',faqs:[],pub:true})});$('#zm')?.remove()}
toast('Saved – open the preview to see the change');if(k=='gal'||k=='course')cms()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.enq){const a=DB.get('enquiries');a.find(x=>x.id==t.dataset.enq)[t.dataset.k]=t.value;DB.set('enquiries',a);toast('Enquiry updated')}
if(t.dataset.v!==undefined){ls.zk_hidden=JSON.stringify([...A.querySelectorAll('[data-v]')].filter(x=>!x.checked).map(x=>x.dataset.v));toast('Section visibility saved')}});
window.zkDispatch=()=>({login,app:appPage,cms}[P]||login)();zkDispatch();
})();
</script>
</body></html>
