/* ===== Responsive + readability upgrade ===== */
:root{--sw:260px;--line:#e2d8e6;--mut:#5b4f63}
html{-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.55;color:#241a2b;overflow-x:hidden}
.side{width:var(--sw);color:#efe3f2;box-shadow:2px 0 14px #0003;-webkit-overflow-scrolling:touch}
.side h2{font-size:19px;letter-spacing:.2px;border-bottom:1px solid #ffffff22;margin-bottom:8px}
.side a{font-size:15.5px;font-weight:500;padding:13px 22px;border-left:3px solid transparent;min-height:46px}

.main{margin-left:var(--sw);padding:28px;max-width:1500px}
#sb{width:44px;height:44px;border-radius:10px;font-size:24px;color:var(--n);background:#f3e9f6;cursor:pointer;line-height:1}
.pm>button{min-height:44px;padding:0 12px;border-radius:8px;font-weight:600;color:var(--n)}
.pm>button:hover{background:#f3e9f6}
.pm div{top:48px;min-width:190px;border:1px solid var(--line)}
.pm a{padding:13px 18px;font-weight:500}.pm a:hover{background:var(--bg)}
.btn{min-height:40px;font-size:14.5px}.btn.s{min-height:34px;padding:6px 12px;font-size:13.5px}

input,select,textarea{border:1.5px solid #c9bccf;font-size:15.5px;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--t);box-shadow:0 0 0 3px #7b2d8e26;outline:0}
.fl span{font-size:14px;color:var(--n);font-weight:700}
.bar{align-items:center}

table{font-size:15px}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:#f4ecf7;font-weight:700;position:sticky;top:0;z-index:1}
td{border-bottom:1px solid #eee5f1;color:#241a2b}
tbody tr:hover{background:#faf5fc}
.badge{font-weight:600;padding:4px 11px}
.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{border:1px solid var(--line);border-left:5px solid var(--a);font-size:14.5px;color:var(--mut);font-weight:500}
.stat b{font-size:32px;line-height:1.2}
.panel{border:1px solid var(--line)}.panel h3{margin-bottom:10px;font-size:18px}
.mod{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr;column-gap:16px;align-items:start}
.mod>*:not(.fl){grid-column:1/-1}.mod>.fl:has(textarea){grid-column:1/-1}
.mod .bt{position:sticky;bottom:-24px;background:#fff;padding:14px 0 2px;border-top:1px solid var(--line);margin-top:8px}
.ov{backdrop-filter:blur(2px)}
.th{width:60px;height:46px}
.bd{display:none}
.lg form{box-shadow:0 20px 50px #0005}.lg input{min-height:46px}.lg .btn{min-height:46px;font-size:16px}
#toasts{max-width:calc(100vw - 36px)}.toast{font-size:15px}
@media(max-width:1100px){:root{--sw:230px}.main{padding:22px}.two{grid-template-columns:1fr}}
@media(max-width:980px){
 :root{--sw:280px}
 .side{transform:translateX(-102%);z-index:60;max-width:86vw}
 body.open .side{transform:none}
 body.open{overflow:hidden}
 .bd{position:fixed;inset:0;background:#0008;z-index:55;display:none}
 body.open .bd{display:block}
 .top,.main{margin-left:0}

 .main{padding:18px 14px calc(28px + env(safe-area-inset-bottom,0))}
}
@media(max-width:700px){
 input,select,textarea{font-size:16px}
 .top>b{font-size:17px}

 .mod .bt{bottom:-18px}.mod .bt .btn{flex:1}
 .ov{align-items:end;padding:8px}
 .toast{padding:12px 14px}
 #toasts{left:14px;right:14px;top:calc(10px + env(safe-area-inset-top,0))}
 /* table rows become readable cards on phones */
 .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
 table.rs,table.rs tbody{display:block}
 table.rs thead{display:none}
 table.rs tr{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:6px 14px;box-shadow:0 2px 8px #3b003f10}
 table.rs td{display:flex;justify-content:space-between;align-items:center;gap:14px;white-space:normal;text-align:right;padding:10px 0;border-bottom:1px dashed #e8dded;word-break:break-word}
 table.rs td:last-child{border-bottom:0}
 table.rs td::before{content:attr(data-label);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;flex:0 0 36%}
 table.rs td.act{display:flex;flex-wrap:wrap;gap:8px;justify-content:stretch;padding-top:12px}
 table.rs td.act::before{display:none}
 table.rs td.act .btn{flex:1;min-height:42px}
 table.rs td[colspan]{display:block;text-align:center}table.rs td[colspan]::before{display:none}
 .panel .tw{background:#fff;border:1px solid var(--line);overflow:auto}
}
@media(max-width:380px){.stats{grid-template-columns:1fr}}

function modal(title,body,ok,okText='Save'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<form class="mod"><h3>${title}</h3>${body}<div class="bt"><button type="button" class="btn g" data-c>Cancel</button>${ok?`<button class="btn${okText==='Delete'?' d':''}">${okText}</button>`:''}</div></form>`;document.body.appendChild(o);
 const close=()=>o.remove();o.onclick=e=>{if(e.target===o||e.target.dataset.c!==undefined)close()};
 o.querySelector('form').onsubmit=e=>{e.preventDefault();if(ok&&ok(e.target)!==false)close()};
 o.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.7);o.querySelector(`[name=${f}]`).value=u;o.querySelector('.prev').src=u};i.src=r.result};r.readAsDataURL(e.target.files[0])});
 return close}
const confirmBox=(m,cb)=>modal('Please confirm',`<p>${m}</p>`,()=>{cb()},'Delete');
function inp(f,v){const[k,l,t,o]=f;let h;
 if(t==='big')h=`<textarea name="${k}" rows="12">${esc(v)}</textarea>`;
 else if(t==='area')h=`<textarea name="${k}" rows="3">${esc(v)}</textarea>`;
 else if(t==='lines')h=`<textarea name="${k}" rows="8">${esc((v||[]).join('\n'))}</textarea>`;
 else if(t==='select'){const op=typeof o==='function'?o():o;h=`<select name="${k}">${op.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select>`}
 else if(t==='pub')h=`<label class="chk"><input type="checkbox" name="${k}"${v?' checked':''}> Yes</label>`;
 else if(t==='img')h=`<input name="${k}" value="${esc(v)}" placeholder="Image URL, or upload below"><input type="file" accept="image/*" data-f="${k}"><img class="prev" src="${esc(v)}" alt="">`;
 else if(t==='multi')h=DB.get('courses').map(c=>`<label class="chk"><input type="checkbox" name="${k}" value="${c.id}"${(v||[]).includes(c.id)?' checked':''}> ${esc(c.title)}</label>`).join('');
 else h=`<input name="${k}" value="${esc(v)}">`;
 return `<div class="fl"><span>${l}</span>${h}</div>`}
function collect(form,fs){const o={};fs.forEach(([k,,t])=>{const e=form.elements[k];
 if(t==='pub')o[k]=e.checked;else if(t==='lines')o[k]=e.value.split('\n').map(s=>s.trim()).filter(Boolean);
 else if(t==='multi')o[k]=$$(`[name=${k}]:checked`,form).map(x=>+x.value);else o[k]=e.value.trim()});return o}

function cell(m,c,r){const f=m.f.find(x=>x[0]===c),v=r[c];
 if(f&&f[2]==='img')return v?`<img class="th" src="${esc(v)}" data-big alt="">`:'';
 if(f&&f[2]==='pub')return `<button class="badge ${v?'on':''}" data-pub="${r.id}" title="Click to toggle">${v?'Published':m.draft?'Draft':'Hidden'}</button>`;
 if(c==='date')return fd(v);if(c==='status')return `<span class="badge ${esc(v)}">${esc(v)}</span>`;return esc(v)}
function rows(k){const m=M[k];let a=DB.get(k);const q=$('#q').value.toLowerCase();
 if(q)a=a.filter(r=>m.cols.some(c=>String(r[c]??'').toLowerCase().includes(q))||String(r.phone||'').includes(q));
 $$('[data-fi]').forEach(s=>{if(s.value)a=a.filter(r=>r[m.flt[s.dataset.fi][0]]==s.value)});
 if(m.date&&$('#dt').value)a=a.filter(r=>r.date.slice(0,10)===$('#dt').value);
 $('#tb').innerHTML=a.map(r=>`<tr>${m.cols.map(c=>`<td>${cell(m,c,r)}</td>`).join('')}<td class="act"><button class="btn s g" data-e="${r.id}">${m.noadd?'View / Update':'Edit'}</button><button class="btn s d" data-d="${r.id}">Delete</button></td></tr>`).join('')||`<tr><td colspan="9">No records found.</td></tr>`}
function form(k,r){const m=M[k],isN=!r;r=r||{};modal(`${isN?'Add':m.noadd?'Enquiry details':'Edit'} ${m.s}`,m.f.map(f=>inp(f,r[f[0]]??(f[2]==='pub'?true:''))).join(''),fm=>{
 const o=collect(fm,m.f),req=m.f[0][0];if(!o[req]){toast(`${m.f[0][1]} is required`,'err');return false}
 const a=DB.get(k);if(isN){o.id=DB.nextId(a);o.date=new Date().toISOString();a.unshift(o)}else Object.assign(a.find(x=>x.id===r.id),o);
 if(!save(k,a))return false;log(`${isN?'Added':'Updated'} ${m.s}: ${o[req]}`);toast(m.s+' saved');rows(k)})}
function list(k){const m=M[k];$('#main').innerHTML=`<div class="bar"><input id="q" placeholder="Search…">${(m.flt||[]).map(([,l,o],i)=>`<select data-fi="${i}"><option value="">All ${l}</option>${o().map(x=>`<option>${esc(x)}</option>`).join('')}</select>`).join('')}${m.date?'<input type="date" id="dt" title="Filter by date">':''}${m.noadd?'':`<button class="btn" id="add">+ Add ${m.s}</button>`}${m.exp?'<button class="btn g" id="exp">Export CSV</button>':''}</div><div class="tw"><table><thead><tr>${m.cols.map(c=>`<th>${(m.f.find(x=>x[0]===c)||[0,c==='date'?'Date':c])[1].replace(/ \(.*/,'')}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>`;
 rows(k);$('#main').oninput=e=>{if(e.target.matches('#q,#dt,[data-fi]'))rows(k)};
 $('#main').onchange=e=>{if(e.target.matches('#dt,[data-fi]'))rows(k)};
 $('#main').onclick=e=>{const t=e.target,a=DB.get(k);
  if(t.id==='add')form(k);else if(t.id==='exp')csv(k);
  else if(t.dataset.e)form(k,a.find(x=>x.id==t.dataset.e));
  else if(t.dataset.d){const r=a.find(x=>x.id==t.dataset.d);confirmBox(`Delete “${esc(r[m.f[0][0]])}”? This cannot be undone.`,()=>{save(k,a.filter(x=>x.id!==r.id));log(`Deleted ${m.s}: ${r[m.f[0][0]]}`);toast(m.s+' deleted');rows(k)})}
  else if(t.dataset.pub){const r=a.find(x=>x.id==t.dataset.pub);r.pub=!r.pub;save(k,a);log(`${r.pub?'Published':'Unpublished'} ${m.s}: ${r[m.f[0][0]]}`);toast(r.pub?'Published':m.draft?'Moved to draft':'Hidden');rows(k)}
  else if(t.dataset.big!==undefined)modal('Preview',`<img src="${esc(t.src)}" style="width:100%;border-radius:8px" alt="">`)}}
function csv(k){const a=DB.get(k),ks=Object.keys(a[0]||{}),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',s=[ks.join(','),...a.map(r=>ks.map(x=>q(r[x])).join(','))].join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));l.download=k+'.csv';l.click();toast('Exported '+a.length+' rows')}
function sform(k){const s=SF[k],v=DB.get(k);$('#main').innerHTML=`<form class="panel">${s.f.map(f=>inp(f,v[f[0]])).join('')}<button class="btn">Save changes</button></form>`;
 $('#main form').onsubmit=e=>{e.preventDefault();const o=collect(e.target,s.f);if(k==='profile'&&(!o.user||!o.pass))return toast('Username and password required','err');if(save(k,{...v,...o})){log('Updated '+s.t);toast('Saved')}};
 $('#main form').onchange=e=>{const f=e.target.dataset.f;if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const z=Math.min(1,1200/i.width),c=document.createElement('canvas');c.width=i.width*z;c.height=i.height*z;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.7);$(`[name=${f}]`).value=u;$('.prev').src=u};i.src=r.result};r.readAsDataURL(e.target.files[0])}}
function dash(){const g=k=>DB.get(k),en=g('enquiries');const st=[['Courses',g('courses').length],['Trainers',g('trainers').length],['Testimonials',g('testimonials').length],['Articles',g('blog').length],['Total enquiries',en.length],['New enquiries',en.filter(x=>x.status==='New').length]];
 $('#main').innerHTML=`<div class="stats">${st.map(s=>`<div class="stat"><b>${s[1]}</b>${s[0]}</div>`).join('')}</div><div class="two"><div class="panel"><h3>Recent enquiries</h3><div class="tw" style="box-shadow:none"><table><tbody>${en.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.course)}</td><td>${fd(r.date)}</td><td><span class="badge ${r.status}">${r.status}</span></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Recent content updates</h3><ul>${g('log').slice(0,6).map(l=>`<li>${esc(l.m)}<br><small>${fd(l.d)}</small></li>`).join('')}</ul></div></div>`}

function shell(h){const sec=NAV.find(n=>n[0]===h)||NAV[0],p=DB.get('profile');

 h==='dashboard'?dash():M[h]?list(h):sform(h)}

</script><script>
(function(){

  document.querySelectorAll('table').forEach(function(t){
   var th=t.querySelectorAll('thead th');if(!th.length)return;

 }
